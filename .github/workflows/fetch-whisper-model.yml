name: Fetch Whisper Model

on:
  push:
    paths:
      - '.github/workflows/fetch-whisper-model.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download multilingual Whisper base model
        run: |
          set -euxo pipefail
          curl -L --fail --retry 5 --retry-delay 5 \
            -o ggml-base.bin \
            https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base.bin
          zip -1 whisper-base-model.zip ggml-base.bin
      - name: Upload model archive
        uses: actions/upload-artifact@v4
        with:
          name: whisper-base-model-zip
          path: whisper-base-model.zip
          retention-days: 1
          if-no-files-found: error
